# XcodeGen spec. Run `xcodegen` to (re)create Point.xcodeproj, which is not checked in.
name: Point
options:
  bundleIdPrefix: org.mikegallagher
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VaultKit:
    path: Packages/VaultKit
  EditorKit:
    path: Packages/EditorKit
  MarkdownKit:
    path: Packages/MarkdownKit
  IndexKit:
    path: Packages/IndexKit
targets:
  Point-Mac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac
      # The app icon (Icon Composer: light and dark; Xcode makes older systems' icon from it).
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: VaultKit
      - package: EditorKit
      - package: MarkdownKit
      - package: IndexKit
    settings:
      base:
        PRODUCT_NAME: Point
        # Kept from when the app was called Imprint: a new identifier would mean a new
        # sandbox container, losing the settings and the vault's saved access.
        PRODUCT_BUNDLE_IDENTIFIER: org.mikegallagher.imprint
        # Ad-hoc signing ("Sign to Run Locally") until there is a paid developer account.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Point
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Sandboxed, with access only to the folder the user picks.
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/Point.entitlements
      configs:
        # Debug builds run unsandboxed so a test vault can be opened by path
        # (`-PointVault <path>`) without the folder picker.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/Mac/Point-Debug.entitlements

# XcodeGen spec. Run `xcodegen` to (re)create Point.xcodeproj, which is not checked in.
name: Point
options:
  bundleIdPrefix: org.mikegallagher
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VaultKit:
    path: Packages/VaultKit
  EditorKit:
    path: Packages/EditorKit
  MarkdownKit:
    path: Packages/MarkdownKit
  IndexKit:
    path: Packages/IndexKit
targets:
  Point-Mac:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac
        excludes: [Info.plist]
      - Apps/Shared
      # The app icon (Icon Composer: light and dark; Xcode makes older systems' icon from it).
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      # Icons to choose from in Settings, one Icon Composer file each, named as listed in
      # ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES below (and in `AppIconChoice`).
      - path: Resources/AppIcons/Ink.icon
        type: file
        buildPhase: resources
      - path: Resources/AppIcons/Sage.icon
        type: file
        buildPhase: resources
    dependencies:
      # Shows the chosen app icon in the Dock while Point isn't running.
      - target: PointDockTile
        embed: true
        copy:
          destination: plugins
      - package: VaultKit
      - package: EditorKit
      - package: MarkdownKit
      - package: IndexKit
    settings:
      base:
        PRODUCT_NAME: Point
        # Kept from when the app was called Imprint: a new identifier would mean a new
        # sandbox container, losing the settings and the vault's saved access.
        PRODUCT_BUNDLE_IDENTIFIER: org.mikegallagher.imprint
        # Ad-hoc signing ("Sign to Run Locally") until there is a paid developer account.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Point
        # Keys the build settings can't give (the Dock tile plug-in), merged in.
        INFOPLIST_FILE: Apps/Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: Ink Sage
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Sandboxed, with access only to the folder the user picks.
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/Point.entitlements
      configs:
        # Debug builds run unsandboxed so a test vault can be opened by path
        # (`-PointVault <path>`) without the folder picker.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/Mac/Point-Debug.entitlements
  # The iPhone app (M4). For now a spike: the shared editor in UIKit, timed (plan/m4-iphone.md).
  Point-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/iOS
        excludes: [Info.plist]
    dependencies:
      - package: VaultKit
      - package: EditorKit
      - package: MarkdownKit
      - package: IndexKit
    settings:
      base:
        PRODUCT_NAME: Point
        PRODUCT_BUNDLE_IDENTIFIER: org.mikegallagher.point.ios
        GENERATE_INFOPLIST_FILE: YES
        # The quick action (New Note), which build settings can't give, merged in.
        INFOPLIST_FILE: Apps/iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Point
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The vault folder (in the app's Documents) shows in the Files app, to copy notes in.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Signed with Mike's personal team (a free account: builds last 7 days, and can't
        # have extensions until the paid account).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8S9H25AJ7
  # The Dock tile plug-in: loaded by the Dock, to show the app icon chosen in Settings while
  # Point isn't running. Embedded in Point.app/Contents/PlugIns.
  PointDockTile:
    type: bundle
    platform: macOS
    sources:
      - Apps/DockTile
      - Apps/Shared
    settings:
      base:
        PRODUCT_NAME: PointDockTile
        PRODUCT_BUNDLE_IDENTIFIER: org.mikegallagher.imprint.docktile
        WRAPPER_EXTENSION: docktileplugin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: PointDockTilePlugIn
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        # Its one class runs on the Dock's main thread, called by AppKit.
        SWIFT_VERSION: "5.0"

